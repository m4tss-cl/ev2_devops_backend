name: CI/CD Pipeline to AWS EC2 (Split Backends)

on:
  push:
    branches:
      - deploy

# ─────────────────────────────────────────────
# REQUIRED GITHUB SECRETS:
#
#   DOCKERHUB_USERNAME       → Docker Hub user
#   DOCKERHUB_TOKEN          → Docker Hub access token
#
#   FRONTEND_EC2_IP          → Public IP of bastion/frontend EC2
#   BACKEND_EC2_IP           → Private IP of backend EC2 #1  (ventas)
#   BACKEND2_EC2_IP          → Private IP of backend EC2 #2  (despacho)
#   AWS_USER                 → EC2 SSH username (e.g. ec2-user / ubuntu)
#   AWS_SSH_KEY              → Private SSH key (PEM contents)
#
#   AWS_ACCESS_KEY_ID        → IAM key with ec2:AuthorizeSecurityGroupIngress
#                              + ec2:RevokeSecurityGroupIngress
#   AWS_SECRET_ACCESS_KEY    → IAM secret for the key above
#   AWS_REGION               → e.g. us-east-1
#   FRONTEND_SG_ID           → sg-00917bfa35430e948  (frontend-sg)
#
# ONE-TIME AWS MANUAL STEP (do this once in the console):
#   In backend-sg (sg-0ddcba0b902d358b1) add an inbound rule:
#     Type: SSH | Protocol: TCP | Port: 22 | Source: sg-00917bfa35430e948
#   This lets the bastion SSH into both backend instances.
# ─────────────────────────────────────────────

jobs:
  # ==========================================
  # FASE 1: CONSTRUIR Y SUBIR A DOCKER HUB
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile 1 exposes 8080 → ventas
      - name: Build and Push Ventas Image
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST-ventas
          push: true
          tags: m4tss/springboot-api-rest-ventas:latest

      # Dockerfile 2 exposes 8081 → despacho
      - name: Build and Push Despacho Image
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST-DESPACHO
          push: true
          tags: m4tss/springboot-api-rest-despacho:latest

  # ==========================================
  # FASE 2: DESPLEGAR VENTAS EN EC2 #1
  # ==========================================
  deploy-ventas:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # ── 1. Get this runner's public IP ──────────────────────────────────
      - name: Get runner IP
        id: ip
        run: echo "ipv4=$(curl -sf https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      # ── 2. Open SSH on the bastion for this runner ───────────────────────
      - name: Whitelist runner IP on frontend-sg
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.FRONTEND_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      # ── 3. Deploy via bastion ────────────────────────────────────────────
      - name: Deploy Ventas via Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND_EC2_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          proxy_host: ${{ secrets.FRONTEND_EC2_IP }}
          proxy_username: ${{ secrets.AWS_USER }}
          proxy_key: ${{ secrets.AWS_SSH_KEY }}
          # Give MySQL a moment to be ready on cold starts
          command_timeout: 5m
          script: |
            # 1. Red interna
            docker network create ventas_net || true

            # 2. Base de datos (conserva el volumen 'venta')
            docker start mysqldb-ventas 2>/dev/null || \
              docker run -d \
                --name mysqldb-ventas \
                --network ventas_net \
                -e MYSQL_ROOT_PASSWORD=root \
                -e MYSQL_DATABASE=ventas \
                -v venta:/var/lib/mysql \
                --restart always \
                mysql:8.4

            # 3. Esperar a que MySQL acepte conexiones (hasta 60s)
            echo "Waiting for MySQL..."
            for i in $(seq 1 12); do
              docker exec mysqldb-ventas mysqladmin ping -uroot -proot --silent 2>/dev/null && break
              sleep 5
            done

            # 4. Actualizar imagen
            docker pull m4tss/springboot-api-rest-ventas:latest
            docker rm -f springboot-api-rest-ventas 2>/dev/null || true

            # 5. Correr la API
            #    Dockerfile expone 8080 → mapeamos al host en 8081
            docker run -d \
              --name springboot-api-rest-ventas \
              --network ventas_net \
              -p 8081:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb-ventas:3306/ventas \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=root \
              --restart always \
              m4tss/springboot-api-rest-ventas:latest

            # 6. Limpieza
            docker image prune -f

      # ── 4. Always revoke the runner IP (even if deploy failed) ───────────
      - name: Revoke runner IP from frontend-sg
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.FRONTEND_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

  # ==========================================
  # FASE 3: DESPLEGAR DESPACHO EN EC2 #2
  # ==========================================
  deploy-despacho:
    needs: [build-and-push, deploy-ventas]
    runs-on: ubuntu-latest
    steps:
      # ── 1. Get this runner's public IP ──────────────────────────────────
      - name: Get runner IP
        id: ip
        run: echo "ipv4=$(curl -sf https://checkip.amazonaws.com)" >> $GITHUB_OUTPUT

      # ── 2. Open SSH on the bastion for this runner ───────────────────────
      - name: Whitelist runner IP on frontend-sg
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.FRONTEND_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

      # ── 3. Deploy via bastion ────────────────────────────────────────────
      - name: Deploy Despacho via Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BACKEND2_EC2_IP }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          proxy_host: ${{ secrets.FRONTEND_EC2_IP }}
          proxy_username: ${{ secrets.AWS_USER }}
          proxy_key: ${{ secrets.AWS_SSH_KEY }}
          command_timeout: 5m
          script: |
            # 1. Red interna
            docker network create despacho_net || true

            # 2. Base de datos (conserva el volumen 'despacho')
            docker start mysqldb-despacho 2>/dev/null || \
              docker run -d \
                --name mysqldb-despacho \
                --network despacho_net \
                -e MYSQL_ROOT_PASSWORD=root \
                -e MYSQL_DATABASE=despacho \
                -v despacho:/var/lib/mysql \
                --restart always \
                mysql:8.4

            # 3. Esperar a que MySQL acepte conexiones (hasta 60s)
            echo "Waiting for MySQL..."
            for i in $(seq 1 12); do
              docker exec mysqldb-despacho mysqladmin ping -uroot -proot --silent 2>/dev/null && break
              sleep 5
            done

            # 4. Actualizar imagen
            docker pull m4tss/springboot-api-rest-despacho:latest
            docker rm -f springboot-api-rest-despacho 2>/dev/null || true

            # 5. Correr la API
            #    Dockerfile expone 8081 → mapeamos al host en 8080
            docker run -d \
              --name springboot-api-rest-despacho \
              --network despacho_net \
              -p 8080:8081 \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb-despacho:3306/despacho \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=root \
              --restart always \
              m4tss/springboot-api-rest-despacho:latest

            # 6. Limpieza
            docker image prune -f

      # ── 4. Always revoke the runner IP (even if deploy failed) ───────────
      - name: Revoke runner IP from frontend-sg
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.FRONTEND_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
